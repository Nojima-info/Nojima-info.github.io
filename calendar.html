<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar｜Nojima-info</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Nojima-info</h1>
<button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
</header>
<nav class="menu">
<a href="index.html">Top</a>
<a href="calendar.html">Calendar</a>
<a href="music.html">Music</a>
<a href="profile.html">Profile</a>
</nav>
<main class="page-content calendar-page">
<h2 class="calendar-page-title">Calendar</h2>
<p class="calendar-page-description">野島家の皆さんが出演されるメディアの情報や、イベントの開催日などの予定をまとめています。</p>
<section class="calendar-controls">
<button id="prev-month" type="button" aria-label="前の月">‹</button>
<label class="calendar-month-picker">
<input id="month-picker" type="month" aria-label="表示する年月">
<span id="calendar-title">2026年9月</span>
</label>
<button id="next-month" type="button" aria-label="次の月">›</button>
</section>
  <section class="regular-schedules" id="regular-schedules">
<h3>今月のレギュラー予定</h3>
<div id="regular-schedule-list" class="event-list">
<p>この月のレギュラー予定はありません。</p>
</div>
</section>
<section class="calendar" aria-label="カレンダー">
<div class="calendar-weekdays">
<div>日</div>
<div>月</div>
<div>火</div>
<div>水</div>
<div>木</div>
<div>金</div>
<div>土</div>
</div>
<div class="calendar-days" id="calendar-days"></div>
</section>
<section class="selected-date" id="selected-date" hidden>
<h3 id="selected-date-title"></h3>
<p>この日の予定はありません。</p>
</section>
<section class="calendar-search">
<button id="search-toggle" class="calendar-search-toggle" type="button" aria-expanded="false" aria-controls="calendar-search-panel">
<span id="search-toggle-icon">＋</span>
<span>検索</span>
</button>
<div id="calendar-search-panel" class="calendar-search-panel" hidden>
<div class="search-group">
<h3>出演者で検索</h3>
<div class="search-options">
<label><input type="checkbox" name="member" value="野島昭生さん">昭生さん</label>
<label><input type="checkbox" name="member" value="野島裕史さん">裕史さん</label>
<label><input type="checkbox" name="member" value="野島健児さん">健児さん</label>
<label><input type="checkbox" name="member" value="野島透也さん">透也さん</label>
<label><input type="checkbox" name="member" value="野島悠生さん">悠生さん</label>
<label><input type="checkbox" name="member" value="野島瑠玖さん">瑠玖さん</label>
</div>
<div class="search-actions">
<button class="search-button" type="button">検索</button>
<button class="clear-button" type="button">クリア</button>
</div>
</div>
<div class="search-group">
<h3>予定の種類で検索</h3>
<div class="search-options">
<label><input type="checkbox" name="type" value="アニメ">アニメ</label>
  <label><input type="checkbox" name="type" value="ドラマ">ドラマ</label>
    <label><input type="checkbox" name="type" value="映画">映画</label>
<label><input type="checkbox" name="type" value="ナレーション">ナレーション</label>
<label><input type="checkbox" name="type" value="ラジオ">ラジオ</label>
  <label><input type="checkbox" name="type" value="舞台">舞台</label>
  <label><input type="checkbox" name="type" value="イベント">イベント</label>
    <label><input type="checkbox" name="type" value="配信">配信</label>
<label><input type="checkbox" name="type" value="CD">CD</label>
  <label><input type="checkbox" name="type" value="DVD">DVD</label>
<label><input type="checkbox" name="type" value="その他">その他</label>
</div>
  <label class="regular-search-option">
<input type="checkbox" id="search-regular">
レギュラーの予定を表示する
</label>
<div class="search-actions">
<button class="search-button" type="button">検索</button>
<button class="clear-button" type="button">クリア</button>
</div>
</div>
<div class="search-group">
<h3>キーワードで検索</h3>
<div class="search-keyword">
<input id="search-keyword" type="text" placeholder="イベント名などを入力">
</div>
<div class="search-actions">
<button class="search-button" type="button">検索</button>
<button class="clear-button" type="button">クリア</button>
</div>
</div>
</div>
</section>
<section class="search-results" id="search-results" hidden>
<h3>検索結果</h3>
<p id="search-result-count">ヒット数・0件</p>
<div id="search-result-list"></div>
</section>
</main>
<script src="menu.js"></script>
<script src="calendar.js"></script>
</body>
</html>
