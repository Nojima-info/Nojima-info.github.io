<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar｜Nojima-info</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Nojima-info</h1>
<button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
</header>
<nav class="menu">
<a href="index.html">Top</a>
<a href="calendar.html">Calendar</a>
<a href="music.html">Music</a>
<a href="profile.html">Profile</a>
</nav>
<main class="page-content calendar-page">
<h2 class="calendar-page-title">Calendar</h2>
<section class="calendar-controls">
<button id="prev-month" type="button" aria-label="前の月">‹</button>
<label class="calendar-month-picker">
<input id="month-picker" type="month" aria-label="表示する年月">
<span id="calendar-title">2026年9月</span>
</label>
<button id="next-month" type="button" aria-label="次の月">›</button>
</section>
<section class="calendar" aria-label="カレンダー">
  <div class="calendar-weekdays">
<div>日</div>
<div>月</div>
<div>火</div>
<div>水</div>
<div>木</div>
<div>金</div>
<div>土</div>
</div>
<div class="calendar-days" id="calendar-days"></div>
</section>
<section class="selected-date" id="selected-date" hidden>
<h3 id="selected-date-title"></h3>
<p>この日の予定はありません。</p>
</section>
</main>
<script src="menu.js"></script>
<script src="calendar.js"></script>
</body>
</html>
