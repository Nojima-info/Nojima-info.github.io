<body>
<header>

<main class="page-content calendar-page music-page">
<section class="page-intro">
<h1 class="calendar-page-title">Music</h1>
<p class="calendar-page-description">野島家の皆さんがこれまでに歌われた楽曲の一部をサイト上で再生できます。</p>
</section>
  <!-- =========================
    情報提供のお願い
    ========================= -->
<section>
<h2>歌唱曲一覧</h2>
  <!-- =========================
    情報提供のお願い
    ========================= -->
<section>
<h2>歌唱曲一覧</h2>
  <div id="songTabs">
<button type="button" id="allSongsTab" class="active">すべて</button>
<button type="button" id="favoriteSongsTab">♡ お気に入り</button>
</div>
  <button type="button" id="pageShuffleButton">
   🔀 シャッフル再生
</button>
<button type="button" id="searchToggle">
🔍 検索・絞り込み
<span id="searchToggleIcon">＋</span>
</button>
  <div class="search-area">
<div class="search-box">
<h3>曲を検索</h3>
<input
               type="text"
               id="songSearch"
               placeholder="曲名・アーティスト名・歌唱者名など"
>
<button type="button" id="searchButton">検索</button>
  <button type="button" id="clearSearchButton">クリア</button>
</div>
<div class="search-box">
<h3>歌唱人数</h3>
<label>
<input type="checkbox" name="memberCount" value="1">
              ソロ
</label>
<label>
<input type="checkbox" name="memberCount" value="2">
              2人
</label>
<label>
<input type="checkbox" name="memberCount" value="3">
              3人
</label>
<label>
<input type="checkbox" name="memberCount" value="4">
              4人
</label>
<label>
<input type="checkbox" name="memberCount" value="5">
              5人以上
</label>
<button type="button" class="clear-filter-button" data-filter="memberCount">
  すべて解除
</button>
</div>
<div class="search-box">
<h3>楽曲形態</h3>
<label>
<input type="checkbox" name="songType" value="original">
              オリジナル
</label>
<label>
<input type="checkbox" name="songType" value="cover">
              カバー
</label>
<button type="button" class="clear-filter-button" data-filter="songType">
  すべて解除
</button>
</div>
<div class="search-box">
<h3>ユニット</h3>
  <label>
<input type="checkbox" name="unit" value="にじロック">
 にじロック
</label>
  <label>
<input type="checkbox" name="unit" value="le jouet">
 le jouet
</label>
  <label>
<input type="checkbox" name="unit" value="NZMN">
 NZMN
</label>
  <label>
<input type="checkbox" name="unit" value="にじさんじアオハル部">
 にじさんじアオハル部
</label>
  <label>
<input type="checkbox" name="unit" value="夢星家">
              夢星家
</label>
  <label>
<input type="checkbox" name="unit" value="VACHSS">
              VACHSS
</label>
  <label>
<input type="checkbox" name="unit" value="黒夢町">
              黒夢町
</label>
  <label>
<input type="checkbox" name="unit" value="元SEEDs2期生第3弾組">
              元SEEDs2期生第3弾組
</label>
  <label>
<input type="checkbox" name="unit" value="ゆめおいまちた">
              ゆめおいまちた
</label>
  <label>
<input type="checkbox" name="unit" value="共通衣装SPユニット">
              共通衣装SPユニット
</label>
  <label>
<input type="checkbox" name="unit" value="紫男">
              紫男
</label>
  <label>
<input type="checkbox" name="unit" value="実は同期なんです">
              実は同期なんです
</label>
<button type="button" class="clear-filter-button" data-filter="unit">
  すべて解除
</button>
</div>
</div>
<div id="searchResultCount"></div>
  <div id="sortArea">
<label for="sortSelect">並べ替え：</label>
<select id="sortSelect">
<option value="date-asc">古い順</option>
<option value="date-desc">新しい順</option>
<option value="title-asc">名前順</option>
<option value="title-desc">名前順（逆）</option>
</select>
</div>
  <h2>検索結果</h2>
  <div id="favoriteEmptyMessage" style="display: none;">
お気に入りに登録した曲はありません。<br>
曲一覧から♡ボタンを押して、お気に入りに追加できます。
</div>
  <div id="searchEmptyMessage" style="display: none;">
条件に一致する楽曲はありません。
</div>
<div id="songList">
</div>
</section>
  <!-- ミニプレイヤー -->
<div id="miniPlayer">
<div id="miniPlayerThumbnail">
<img id="miniPlayerImage" src="" alt="">
</div>
<div id="miniPlayerInfo">
<div id="miniPlayerTitle">
           曲を選択してください
</div>
<div id="miniPlayerControls">
<button type="button" id="previousButton"></button>
<button type="button" id="playPauseButton"></button>
<button type="button" id="nextButton"></button>
</div>
</div>
</div>
</main>
<footer>
<p class="site-footer-notice">当サイトは非公式のファンサイトです。</p>
</footer>
<button type="button" id="backToSearchButton">↑</button>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="songs.js"></script>
<script src="script.js"></script>
<script src="menu.js"></script>
