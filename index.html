<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top｜Nojima-info</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Nojima-info</h1>
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
  </header>
  <nav class="menu">
    <a href="index.html">Top</a>
    <a href="calendar.html">Calendar</a>
    <a href="music.html">Music</a>
    <a href="profile.html">Profile</a>
  </nav>
  <main class="page-content top-page">
    <button class="info-button" type="button" aria-expanded="false" aria-controls="site-info">このサイトについて</button>
<div id="site-info" class="info-modal" hidden>
  <div class="info-modal-content" role="dialog" aria-modal="true" aria-labelledby="info-modal-title">
    <button class="info-modal-close" type="button" aria-label="閉じる">×</button>
    <h2 id="info-modal-title">サイトについて</h2>
    <p>このサイトは、野島昭生さん、裕史さん、健児さん、透也さん、悠生さん、瑠玖さんに関する情報をまとめた非公式サイトです。</p>
    <p>株式会社シグマ・セブン様、株式会社青二プロダクション様、株式会社松竹エンタテインメント様、株式会社劇団ひまわり様及び各種関係会社様とは一切関係ありません。</p>
    <p>また、このサイトはスマートフォンでの閲覧を想定し作成しています。</p>
  </div>
</div>
  <section class="home-section">
    <h2>野島家の情報</h2>
    <p>ここに野島家に関する最新情報やお知らせを掲載していきます。</p>
  </section>
</main>
  <script src="menu.js"></script>
<script>
const infoButton=document.querySelector(".info-button");
const infoModal=document.querySelector("#site-info");
const infoCloseButton=document.querySelector(".info-modal-close");
if(infoButton&&infoModal&&infoCloseButton){
  infoButton.addEventListener("click",()=>{
    infoModal.hidden=false;
    infoButton.setAttribute("aria-expanded","true");
    infoCloseButton.focus();
  });
  infoCloseButton.addEventListener("click",()=>{
    infoModal.hidden=true;
    infoButton.setAttribute("aria-expanded","false");
    infoButton.focus();
  });
  infoModal.addEventListener("click",(event)=>{
    if(event.target===infoModal){
      infoModal.hidden=true;
      infoButton.setAttribute("aria-expanded","false");
      infoButton.focus();
    }
  });
}
</script>
</body>
</html>
